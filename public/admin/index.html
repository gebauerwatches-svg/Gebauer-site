<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Gebauer Admin</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <style>
    :root {
      --ink: #14111c;
      --gold: #d4a62a;
      --gold-soft: rgba(212, 166, 42, 0.12);
      --bg: #f5f3ef;
      --card: #ffffff;
      --border: #e8e2d6;
      --text: #1a1a1a;
      --muted: #888;
      --danger: #b03030;
      --ok: #2a6b52;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Inter', Arial, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; }
    a { color: var(--gold); text-decoration: none; }
    a:hover { text-decoration: underline; }
    button {
      font-family: inherit; font-size: 13px; padding: 8px 16px; border: 1px solid var(--border);
      background: var(--card); color: var(--text); cursor: pointer; transition: all 0.15s;
    }
    button:hover { border-color: var(--gold); }
    button.primary { background: var(--ink); color: white; border-color: var(--ink); }
    button.primary:hover { background: var(--gold); border-color: var(--gold); color: var(--ink); }
    button.danger { color: var(--danger); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    input, textarea, select {
      font-family: inherit; font-size: 14px; padding: 10px 12px;
      border: 1px solid var(--border); background: var(--card); color: var(--text); width: 100%;
    }
    input:focus, textarea:focus { outline: none; border-color: var(--gold); }
    textarea { resize: vertical; min-height: 120px; font-family: 'Georgia', serif; }
    label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em; }
    .field { margin-bottom: 12px; }

    /* Login screen */
    .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .login-card { background: var(--card); padding: 32px; max-width: 380px; width: 100%; border: 1px solid var(--border); }
    .login-card h1 { font-family: 'Georgia', serif; font-weight: normal; font-size: 24px; color: var(--ink); margin-bottom: 8px; }
    .login-card p { color: var(--muted); font-size: 13px; margin-bottom: 20px; }

    /* App layout */
    .app { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
    .sidebar { background: var(--ink); color: white; padding: 24px 0; }
    .sidebar h2 { font-family: 'Georgia', serif; font-weight: normal; font-size: 18px; padding: 0 24px 24px; color: var(--gold); letter-spacing: 0.05em; }
    .sidebar nav { display: flex; flex-direction: column; }
    .sidebar a {
      color: rgba(255,255,255,0.7); padding: 10px 24px; font-size: 14px;
      border-left: 3px solid transparent; transition: all 0.15s; text-decoration: none;
    }
    .sidebar a:hover { color: white; background: rgba(255,255,255,0.05); }
    .sidebar a.active { color: var(--gold); border-left-color: var(--gold); background: rgba(212,166,42,0.05); }
    .sidebar .logout { margin-top: 32px; padding: 10px 24px; color: var(--muted); font-size: 12px; background: none; border: none; cursor: pointer; text-align: left; }

    main { padding: 32px; max-width: 1100px; }
    .page-title { font-family: 'Georgia', serif; font-weight: normal; font-size: 28px; color: var(--ink); margin-bottom: 4px; }
    .page-sub { color: var(--muted); font-size: 14px; margin-bottom: 24px; }

    /* Stats row */
    .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 24px; }
    .stat { background: var(--card); padding: 16px; border: 1px solid var(--border); }
    .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .stat-value { font-family: 'Georgia', serif; font-size: 28px; color: var(--ink); margin-top: 4px; }

    /* Subscriber table */
    .toolbar { display: flex; gap: 12px; margin-bottom: 16px; align-items: center; }
    .toolbar input { flex: 1; }
    table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--border); }
    th { background: var(--bg); padding: 10px 12px; text-align: left; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
    td { padding: 10px 12px; border-top: 1px solid var(--border); font-size: 13px; }
    tbody tr:hover { background: var(--gold-soft); }
    .status-pill { display: inline-block; padding: 2px 8px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; }
    .status-active { background: rgba(42,107,82,0.1); color: var(--ok); }
    .status-unsubscribed { background: rgba(176,48,48,0.1); color: var(--danger); }

    /* Modal */
    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 24px; }
    .modal { background: var(--card); padding: 24px; max-width: 480px; width: 100%; max-height: 90vh; overflow: auto; }
    .modal h3 { font-family: 'Georgia', serif; font-weight: normal; font-size: 20px; margin-bottom: 16px; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }

    /* Broadcast composer */
    .composer { background: var(--card); padding: 24px; border: 1px solid var(--border); margin-bottom: 24px; }
    .preview-pane { background: var(--bg); padding: 24px; border: 1px solid var(--border); }
    .preview-pane iframe { width: 100%; min-height: 500px; border: none; background: white; }

    /* Story card */
    .story-card { background: var(--card); padding: 16px; border: 1px solid var(--border); margin-bottom: 10px; }
    .story-meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
    .story-text { font-family: 'Georgia', serif; font-size: 14px; color: var(--text); margin-bottom: 8px; }
    .story-actions { display: flex; gap: 6px; }

    .error { color: var(--danger); font-size: 13px; margin-top: 8px; }
    .ok { color: var(--ok); font-size: 13px; margin-top: 8px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div id="app"><p style="padding:24px;color:var(--muted);">Loading...</p></div>

  <script>
    // ---- API helpers ----
    async function api(path, opts = {}) {
      const resp = await fetch(`/admin/api${path}`, {
        ...opts,
        headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) },
        credentials: 'same-origin',
      })
      const ct = resp.headers.get('content-type') || ''
      if (!ct.includes('application/json')) {
        return { error: `Non-JSON response (${resp.status})` }
      }
      const data = await resp.json()
      if (resp.status === 401) { showLogin('Session expired. Sign in again.'); throw new Error('unauth') }
      return data
    }
    const $ = (q, p = document) => p.querySelector(q)
    const $$ = (q, p = document) => Array.from(p.querySelectorAll(q))
    const el = (tag, attrs = {}, ...children) => {
      const e = document.createElement(tag)
      for (const [k, v] of Object.entries(attrs)) {
        if (k === 'class') e.className = v
        else if (k === 'html') e.innerHTML = v
        else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v)
        else if (v === null || v === undefined || v === false) continue
        else e.setAttribute(k, v)
      }
      for (const c of children) {
        if (c == null || c === false) continue
        e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c)
      }
      return e
    }

    // ---- Router ----
    const VIEWS = ['subscribers', 'reservations', 'watches', 'broadcasts', 'welcome', 'stories', 'votes', 'timeline']
    let currentView = 'subscribers'

    function navigate(view) {
      currentView = view
      window.location.hash = view
      render()
    }
    window.addEventListener('hashchange', () => {
      const v = window.location.hash.replace('#', '')
      if (VIEWS.includes(v)) { currentView = v; render() }
    })

    // ---- Auth ----
    async function showLogin(message = '') {
      const app = $('#app')
      app.innerHTML = ''
      app.appendChild(el('div', { class: 'login-wrap' },
        el('form', { class: 'login-card', onsubmit: handleLogin },
          el('h1', {}, 'Gebauer Admin'),
          el('p', {}, message || 'Sign in to manage subscribers, broadcasts, stories, and votes.'),
          el('div', { class: 'field' },
            el('label', {}, 'Password'),
            el('input', { type: 'password', id: 'admin-pass', autofocus: 'true', required: 'true' }),
          ),
          el('button', { type: 'submit', class: 'primary' }, 'Sign in'),
          el('p', { class: 'error hidden', id: 'login-error' }, ''),
        )
      ))
    }

    async function handleLogin(e) {
      e.preventDefault()
      const pass = $('#admin-pass').value
      const errEl = $('#login-error')
      errEl.classList.add('hidden')
      const data = await api('/login', { method: 'POST', body: JSON.stringify({ password: pass }) }).catch(() => null)
      if (data && data.ok) {
        currentView = window.location.hash.replace('#', '') || 'subscribers'
        if (!VIEWS.includes(currentView)) currentView = 'subscribers'
        render()
      } else {
        errEl.textContent = (data && data.error) || 'Login failed.'
        errEl.classList.remove('hidden')
      }
    }

    async function handleLogout() {
      await fetch('/admin/api/logout', { method: 'POST', credentials: 'same-origin' })
      showLogin('Signed out.')
    }

    // ---- Layout shell ----
    function renderShell(contentNode) {
      const app = $('#app')
      app.innerHTML = ''
      const navItem = (id, label) => el('a', {
        href: `#${id}`,
        class: currentView === id ? 'active' : '',
        onclick: (e) => { e.preventDefault(); navigate(id) },
      }, label)
      app.appendChild(el('div', { class: 'app' },
        el('aside', { class: 'sidebar' },
          el('h2', {}, 'GEBAUER'),
          el('nav', {},
            navItem('subscribers', 'Subscribers'),
            navItem('reservations', 'Reservations'),
            navItem('watches', 'Watches'),
            navItem('broadcasts', 'Broadcasts'),
            navItem('welcome', 'Welcome email'),
            navItem('stories', 'Stories'),
            navItem('votes', 'Wood votes'),
            navItem('timeline', 'Timeline'),
          ),
          el('button', { class: 'logout', onclick: handleLogout }, 'Sign out'),
        ),
        el('main', {}, contentNode),
      ))
    }

    // ---- Subscribers view ----
    async function renderSubscribers() {
      renderShell(el('div', {}, el('p', { class: 'page-sub' }, 'Loading...')))
      const data = await api('/subscribers?limit=300').catch(() => ({ subscribers: [], total: 0, active: 0 }))
      const subs = data.subscribers || []

      const searchInput = el('input', {
        type: 'text', placeholder: 'Search email or name...', id: 'subs-search',
        oninput: debounce(async (e) => {
          const q = e.target.value
          const d = await api(`/subscribers?q=${encodeURIComponent(q)}&limit=300`)
          renderSubsTable(d.subscribers || [])
        }, 200),
      })

      const tableWrap = el('div', { id: 'subs-table-wrap' })
      const addBtn = el('button', { class: 'primary', onclick: showAddSubscriberModal }, '+ Add')

      function momentSnippet(s) {
        if (!s.stories) return el('span', { style: 'color:var(--muted);' }, '—')
        const all = s.stories.split('||SEP||').filter(Boolean)
        const first = all[0] || ''
        const snippet = first.length > 50 ? first.slice(0, 50) + '...' : first
        const label = all.length > 1 ? `${snippet} (+${all.length - 1} more)` : snippet
        return el('a', {
          href: '#', style: 'color:var(--gold);',
          onclick: (e) => { e.preventDefault(); showMomentModal(s, all) },
        }, label)
      }

      function renderSubsTable(rows) {
        const tableEl = el('table', {},
          el('thead', {}, el('tr', {},
            el('th', {}, 'Name'),
            el('th', {}, 'Email'),
            el('th', {}, 'Moment'),
            el('th', {}, 'Watch #'),
            el('th', {}, 'Status'),
            el('th', {}, 'Joined'),
            el('th', {}, ''),
          )),
          el('tbody', {}, ...rows.map(s => el('tr', {},
            el('td', {}, s.first_name || ''),
            el('td', {}, s.email),
            el('td', { style: 'max-width:280px;' }, momentSnippet(s)),
            el('td', {}, s.waitlist_position === 9999 ? '—' : `#${s.waitlist_position}`),
            el('td', {}, el('span', { class: `status-pill status-${s.status}` }, s.status)),
            el('td', {}, (s.subscribed_at || '').slice(0, 10)),
            el('td', {}, el('button', { onclick: () => showEditSubscriberModal(s) }, 'Edit')),
          ))),
        )
        tableWrap.innerHTML = ''
        tableWrap.appendChild(rows.length === 0 ? el('p', { class: 'page-sub' }, 'No subscribers match.') : tableEl)
      }
      renderSubsTable(subs)

      renderShell(el('div', {},
        el('h1', { class: 'page-title' }, 'Subscribers'),
        el('p', { class: 'page-sub' }, `${data.active} active, ${data.total} total. Search matches email, name, or moment text.`),
        el('div', { class: 'stats-row' },
          el('div', { class: 'stat' }, el('div', { class: 'stat-label' }, 'Total'), el('div', { class: 'stat-value' }, String(data.total))),
          el('div', { class: 'stat' }, el('div', { class: 'stat-label' }, 'Active'), el('div', { class: 'stat-value' }, String(data.active))),
          el('div', { class: 'stat' }, el('div', { class: 'stat-label' }, 'Watch numbers reserved'), el('div', { class: 'stat-value' }, String(subs.filter(s => s.waitlist_position !== 9999).length))),
          el('div', { class: 'stat' }, el('div', { class: 'stat-label' }, 'Moments'), el('div', { class: 'stat-value' }, String(data.stories_total || 0))),
        ),
        el('div', { class: 'toolbar' }, searchInput, addBtn),
        tableWrap,
      ))
    }

    function showMomentModal(s, stories) {
      const modal = el('div', { class: 'modal-bg', onclick: (e) => { if (e.target.classList.contains('modal-bg')) modal.remove() } },
        el('div', { class: 'modal' },
          el('h3', {}, `${s.first_name || 'Subscriber'} moment${stories.length > 1 ? 's' : ''}`),
          el('p', { class: 'page-sub', style: 'margin-bottom:16px;' }, s.email),
          ...stories.map((text, i) => el('div', { class: 'story-card', style: 'margin-bottom:10px;' },
            stories.length > 1 ? el('div', { class: 'story-meta' }, el('span', {}, `Moment ${i + 1} of ${stories.length}`)) : null,
            el('p', { class: 'story-text' }, text),
          )),
          el('div', { class: 'modal-actions' },
            el('button', { onclick: () => modal.remove() }, 'Close'),
          ),
        )
      )
      document.body.appendChild(modal)
    }

    function showAddSubscriberModal() {
      const modal = el('div', { class: 'modal-bg', onclick: (e) => { if (e.target.classList.contains('modal-bg')) modal.remove() } },
        el('form', { class: 'modal', onsubmit: async (e) => {
          e.preventDefault()
          const errEl = $('#add-err', modal)
          errEl.classList.add('hidden')
          const watchNumRaw = $('#add-watchnum', modal).value
          const watchNum = watchNumRaw ? parseInt(watchNumRaw, 10) : undefined
          const data = await api('/subscribers', {
            method: 'POST',
            body: JSON.stringify({
              email: $('#add-email', modal).value,
              first_name: $('#add-name', modal).value,
              notes: $('#add-notes', modal).value,
              waitlist_position: watchNum,
            }),
          })
          if (data.ok) { modal.remove(); renderSubscribers() }
          else { errEl.textContent = data.error || 'Could not add.'; errEl.classList.remove('hidden') }
        } },
          el('h3', {}, 'Add subscriber'),
          el('div', { class: 'field' }, el('label', {}, 'Email'), el('input', { type: 'email', id: 'add-email', required: 'true' })),
          el('div', { class: 'field' }, el('label', {}, 'First name'), el('input', { type: 'text', id: 'add-name', required: 'true' })),
          el('div', { class: 'field' }, el('label', {}, 'Watch # (1-300, blank = none)'), el('input', { type: 'number', id: 'add-watchnum', min: '1', max: '300' })),
          el('div', { class: 'field' }, el('label', {}, 'Notes (optional)'), el('input', { type: 'text', id: 'add-notes' })),
          el('p', { class: 'error hidden', id: 'add-err' }, ''),
          el('div', { class: 'modal-actions' },
            el('button', { type: 'button', onclick: () => modal.remove() }, 'Cancel'),
            el('button', { type: 'submit', class: 'primary' }, 'Add'),
          ),
        )
      )
      document.body.appendChild(modal)
    }

    function showEditSubscriberModal(s) {
      const modal = el('div', { class: 'modal-bg', onclick: (e) => { if (e.target.classList.contains('modal-bg')) modal.remove() } },
        el('form', { class: 'modal', onsubmit: async (e) => {
          e.preventDefault()
          const errEl = $('#edit-err', modal)
          errEl.classList.add('hidden')
          const data = await api(`/subscriber/${s.id}`, {
            method: 'PUT',
            body: JSON.stringify({
              first_name: $('#edit-name', modal).value,
              waitlist_position: parseInt($('#edit-pos', modal).value, 10) || 9999,
              status: $('#edit-status', modal).value,
              notes: $('#edit-notes', modal).value,
            }),
          })
          if (data.ok) { modal.remove(); renderSubscribers() }
          else { errEl.textContent = data.error || 'Could not save.'; errEl.classList.remove('hidden') }
        } },
          el('h3', {}, `Edit ${s.email}`),
          el('div', { class: 'field' }, el('label', {}, 'First name'), el('input', { type: 'text', id: 'edit-name', value: s.first_name || '' })),
          el('div', { class: 'field' }, el('label', {}, 'Watch # (1-300, blank = none)'), el('input', { type: 'number', id: 'edit-pos', value: s.waitlist_position === 9999 ? '' : s.waitlist_position })),
          el('div', { class: 'field' }, el('label', {}, 'Status'),
            el('select', { id: 'edit-status' },
              el('option', { value: 'active', selected: s.status === 'active' ? 'true' : null }, 'active'),
              el('option', { value: 'unsubscribed', selected: s.status === 'unsubscribed' ? 'true' : null }, 'unsubscribed'),
              el('option', { value: 'bounced', selected: s.status === 'bounced' ? 'true' : null }, 'bounced'),
            ),
          ),
          el('div', { class: 'field' }, el('label', {}, 'Notes'), el('input', { type: 'text', id: 'edit-notes', value: s.notes || '' })),
          el('p', { class: 'error hidden', id: 'edit-err' }, ''),
          el('div', { class: 'modal-actions' },
            el('button', { type: 'button', class: 'danger', onclick: async () => {
              if (!confirm(`Permanently delete ${s.email}? This cannot be undone.`)) return
              await api(`/subscriber/${s.id}`, { method: 'DELETE' })
              modal.remove(); renderSubscribers()
            } }, 'Delete'),
            el('button', { type: 'button', onclick: () => modal.remove() }, 'Cancel'),
            el('button', { type: 'submit', class: 'primary' }, 'Save'),
          ),
        )
      )
      document.body.appendChild(modal)
    }

    // ---- Broadcasts view ----
    async function renderBroadcasts() {
      renderShell(el('div', {}, el('p', { class: 'page-sub' }, 'Loading...')))
      const data = await api('/broadcasts').catch(() => ({ broadcasts: [] }))
      const history = data.broadcasts || []

      const composer = el('div', { class: 'composer' },
        el('h3', { class: 'page-title', style: 'font-size:20px;margin-bottom:12px;' }, 'New broadcast'),
        el('div', { class: 'field' },
          el('label', {}, 'Subject'),
          el('input', { type: 'text', id: 'bc-subject', placeholder: 'e.g. June 22 update' }),
        ),
        el('div', { class: 'field' },
          el('label', {}, 'Body (markdown). No em dashes — voice guard blocks them.'),
          el('textarea', { id: 'bc-body', placeholder: 'Hi guys,\n\nQuick update...\n\nRock on.\n-Liam' }),
        ),
        el('div', { class: 'toolbar' },
          el('button', { onclick: async () => {
            const subject = $('#bc-subject').value
            const body = $('#bc-body').value
            if (!subject || !body) return alert('Subject and body required.')
            const data = await api('/broadcasts/preview', { method: 'POST', body: JSON.stringify({ subject, body }) })
            if (data.error) { alert(data.error); return }
            const previewEl = $('#bc-preview')
            previewEl.innerHTML = ''
            const iframe = el('iframe', {})
            previewEl.appendChild(iframe)
            iframe.contentDocument.open(); iframe.contentDocument.write(data.html); iframe.contentDocument.close()
          } }, 'Preview'),
          el('button', { class: 'primary', onclick: async () => {
            const subject = $('#bc-subject').value
            const body = $('#bc-body').value
            if (!subject || !body) return alert('Subject and body required.')
            const conf = prompt(`Send "${subject}" to all active subscribers? Type SEND to confirm.`)
            if (conf !== 'SEND') return
            const sendBtn = event.target
            sendBtn.disabled = true; sendBtn.textContent = 'Sending...'
            const data = await api('/broadcasts/send', { method: 'POST', body: JSON.stringify({ subject, body }) })
            sendBtn.disabled = false; sendBtn.textContent = 'Send'
            if (data.error) { alert('Error: ' + data.error); return }
            alert(`Done. Sent: ${data.sent}, Failed: ${data.failed}.`)
            renderBroadcasts()
          } }, 'Send'),
        ),
        el('p', { class: 'page-sub', style: 'margin-top:12px;' }, 'Voice guard refuses em/en dashes. Replace with periods or commas.'),
      )

      const preview = el('div', { class: 'preview-pane', id: 'bc-preview' },
        el('p', { class: 'page-sub' }, 'Preview will appear here after you click Preview.'),
      )

      const historyTable = history.length === 0
        ? el('p', { class: 'page-sub' }, 'No broadcasts sent yet.')
        : el('table', {},
            el('thead', {}, el('tr', {}, el('th', {}, 'Subject'), el('th', {}, 'Recipients'), el('th', {}, 'Sent'))),
            el('tbody', {}, ...history.map(b => el('tr', {},
              el('td', {}, b.subject),
              el('td', {}, String(b.recipients_count)),
              el('td', {}, (b.sent_at || '').replace('T', ' ').slice(0, 16)),
            ))),
          )

      renderShell(el('div', {},
        el('h1', { class: 'page-title' }, 'Broadcasts'),
        el('p', { class: 'page-sub' }, 'Compose and send emails to all active subscribers.'),
        composer,
        preview,
        el('h2', { class: 'page-title', style: 'font-size:20px;margin:32px 0 12px;' }, 'History'),
        historyTable,
      ))
    }

    // ---- Stories view ----
    async function renderStories() {
      renderShell(el('div', {}, el('p', { class: 'page-sub' }, 'Loading...')))
      const data = await api('/stories').catch(() => ({ stories: [] }))
      const all = data.stories || []

      const list = el('div', {}, ...all.map(s => el('div', { class: 'story-card' },
        el('div', { class: 'story-meta' },
          el('span', {}, `${s.first_name} <${s.email}>`),
          el('span', {}, s.status),
        ),
        el('p', { class: 'story-text' }, s.story),
        el('div', { class: 'story-actions' },
          el('button', { onclick: async () => {
            await api(`/story/${s.id}`, { method: 'PUT', body: JSON.stringify({ status: 'approved' }) })
            renderStories()
          } }, 'Approve'),
          el('button', { onclick: async () => {

    // ---- Timeline view ----
    async function renderTimeline() {
      renderShell(el('div', {}, el('p', { class: 'page-sub' }, 'Loading...')))
      const settings = await api('/settings').catch(() => ({ settings: {} }))
      const publicResp = await fetch('/api/timeline').then(r => r.json()).catch(() => ({ milestones: [] }))

      let items
      try {
        const raw = settings.settings && settings.settings.timeline_json
        items = raw ? JSON.parse(raw) : publicResp.milestones
      } catch { items = publicResp.milestones || [] }
      if (!Array.isArray(items)) items = []

      const STATUSES = ['done', 'current', 'upcoming']

      function listWrap() {
        const wrap = el('div', { id: 'tl-list' })
        items.forEach((m, i) => {
          wrap.appendChild(el('div', { class: 'composer', style: 'padding:16px;margin-bottom:10px;' },
            el('div', { class: 'toolbar', style: 'margin-bottom:8px;' },
              el('div', { class: 'field', style: 'flex:2;margin:0;' },
                el('label', {}, 'Label'),
                el('input', { type: 'text', value: m.label || '', oninput: (e) => { items[i].label = e.target.value } }),
              ),
              el('div', { class: 'field', style: 'flex:1;margin:0;' },
                el('label', {}, 'When'),
                el('input', { type: 'text', value: m.when || '', oninput: (e) => { items[i].when = e.target.value } }),
              ),
              el('div', { class: 'field', style: 'flex:1;margin:0;' },
                el('label', {}, 'Status'),
                el('select', { onchange: (e) => { items[i].status = e.target.value } },
                  ...STATUSES.map(s => el('option', { value: s, selected: m.status === s ? 'true' : null }, s)),
                ),
              ),
            ),
            el('div', { class: 'toolbar' },
              el('div', { class: 'field', style: 'flex:1;margin:0;' },
                el('label', {}, 'ID (used for image lookup)'),
                el('input', { type: 'text', value: m.id || '', oninput: (e) => { items[i].id = e.target.value } }),
              ),
              el('button', { onclick: () => { if (i > 0) { [items[i-1], items[i]] = [items[i], items[i-1]]; redraw() } } }, 'Move up'),
              el('button', { onclick: () => { if (i < items.length - 1) { [items[i], items[i+1]] = [items[i+1], items[i]]; redraw() } } }, 'Move down'),
              el('button', { class: 'danger', onclick: () => { items.splice(i, 1); redraw() } }, 'Delete'),
            ),
          ))
        })
        return wrap
      }

      function redraw() {
        const old = $('#tl-list')
        const fresh = listWrap()
        old.replaceWith(fresh)
      }

      const addBtn = el('button', { onclick: () => {
        items.push({ id: 'milestone-' + (items.length + 1), label: 'New milestone', when: '', status: 'upcoming' })
        redraw()
      } }, '+ Add milestone')

      const saveBtn = el('button', { class: 'primary', onclick: async () => {
        // Strip empty rows; validate status
        const clean = items
          .filter(m => (m.label || '').trim())
          .map(m => ({
            id: (m.id || '').trim() || 'milestone',
            label: (m.label || '').trim(),
            when: (m.when || '').trim(),
            status: STATUSES.includes(m.status) ? m.status : 'upcoming',
          }))
        const resp = await api('/settings', {
          method: 'PUT',
          body: JSON.stringify({ timeline_json: JSON.stringify(clean) }),
        })
        if (resp.ok) alert('Saved. Live in seconds.'); else alert('Error: ' + (resp.error || 'unknown'))
      } }, 'Save')

      renderShell(el('div', {},
        el('h1', { class: 'page-title' }, 'Timeline'),
        el('p', { class: 'page-sub' }, 'Edit the milestones shown on the insider page. Status "done" gets a checkmark, "current" is highlighted, "upcoming" is dim.'),
        listWrap(),
        el('div', { class: 'toolbar' }, addBtn, saveBtn),

    // ---- Watches view (per-variant grids) ----
    async function renderWatches() {
      renderShell(el('div', {}, el('p', { class: 'page-sub' }, 'Loading...')))
      const data = await api('/watches').catch(() => ({ assigned: [], pending: [] }))
      const assigned = data.assigned || []
      const pending = data.pending || []

      const WOODS = [
        { key: 'hinoki', label: 'Hinoki', color: '#e8dbb0', border: '#c4b478' },
        { key: 'ebony', label: 'Black Ebony', color: '#3a3028', border: '#5a4d40' },
        { key: 'padauk', label: 'African Padauk', color: '#c46a3a', border: '#9c5028' },
      ]

      // Fallback wood if notes don't explicitly mention one:
      //   position 1-100 defaults to Hinoki, 101-200 Ebony, 201-300 Padauk.
      // This only matters for subscribers who don't have a wood mentioned
      // in their notes column (old data from the pre-per-variant era).
      function fallbackWoodForPos(n) {
        if (n <= 100) return 'hinoki'
        if (n <= 200) return 'ebony'
        return 'padauk'
      }

      // Build per-wood assignment maps: byWood[wood][positionWithinWood] = subscriber
      // For each assigned subscriber:
      //   - wood = notes hint if present, else fallback by position range
      //   - positionWithinWood:
      //       * if wood matches fallback: use raw position (mod 100 for ebony/padauk)
      //       * if wood is set via notes and doesn't match fallback: use raw
      //         position as-is (that's the number the customer chose within
      //         their wood variant)
      const byWood = { hinoki: {}, ebony: {}, padauk: {} }
      for (const a of assigned) {
        const wood = a.wood_hint || fallbackWoodForPos(a.position)
        // Position within variant: if raw position is in the 1-100 range,
        // use as-is regardless of wood (that's the per-variant number the
        // customer picked). If raw position is 101-200 or 201-300 and it
        // fell in the fallback range for its wood, normalize to 1-100.
        let posInVariant = a.position
        if (posInVariant > 100 && posInVariant <= 200 && wood === 'ebony') posInVariant -= 100
        else if (posInVariant > 200 && posInVariant <= 300 && wood === 'padauk') posInVariant -= 200
        byWood[wood][posInVariant] = a
      }

      function cellForPos(n, sectionWood) {
        const a = byWood[sectionWood][n]
        const spec = WOODS.find(w => w.key === sectionWood) || WOODS[0]
        const isTaken = !!a
        const isDarkWood = sectionWood === 'ebony'

        // AVAILABLE = vibrant wood color (jumps out - "you can still get this")
        // RESERVED  = faded/dimmed with strikethrough number (visually clear it's off limits)
        let bg, color, border, opacity, decoration, label
        if (isTaken) {
          bg = '#eeeae2'
          color = 'rgba(80,72,60,0.55)'
          border = '1px dashed rgba(120,110,90,0.4)'
          opacity = '1'
          decoration = 'line-through'
        } else {
          bg = spec.color
          color = isDarkWood ? '#f0ece5' : '#1a1714'
          border = `1px solid ${spec.border}`
          opacity = '1'
          decoration = 'none'
        }

        const cell = el('div', {
          style: `
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Georgia, serif;
            font-size: 11px;
            font-weight: 500;
            cursor: ${isTaken ? 'pointer' : 'default'};
            background: ${bg};
            color: ${color};
            border: ${border};
            opacity: ${opacity};
            text-decoration: ${decoration};
            transition: transform 0.1s, background 0.15s;
            position: relative;
          `,
          title: isTaken
            ? `RESERVED: ${a.first_name} (${a.email}) - ${spec.label} #${n}${a.notes ? '\n' + a.notes : ''}`
            : `${spec.label} #${n} - AVAILABLE`,
        }, String(n))

        if (isTaken) {
          cell.addEventListener('click', () => showWatchDetail(a, spec.label, n))
          cell.addEventListener('mouseenter', () => {
            cell.style.transform = 'scale(1.15)'
            cell.style.zIndex = 10
            cell.style.background = '#dcd6c8'
            cell.style.color = '#1a1714'
          })
          cell.addEventListener('mouseleave', () => {
            cell.style.transform = ''
            cell.style.zIndex = ''
            cell.style.background = '#eeeae2'
            cell.style.color = 'rgba(80,72,60,0.55)'
          })
        }
        return cell
      }

      // Section renderer per wood (each wood is its own 1-100 grid)
      function renderWoodSection(woodKey) {
        const spec = WOODS.find(w => w.key === woodKey)
        const takenCount = Object.keys(byWood[woodKey]).length
        const cells = []
        for (let n = 1; n <= 100; n++) cells.push(cellForPos(n, woodKey))
        return el('section', { style: 'margin-bottom:36px;' },
          el('div', { style: 'display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;' },
            el('h2', { style: `font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;font-size:22px;color:var(--ink);margin:0;` }, spec.label),
            el('span', { style: 'font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;' }, `${100 - takenCount} still available out of 100`),
          ),
          el('div', {
            style: 'display:grid;grid-template-columns:repeat(10,1fr);gap:4px;',
          }, ...cells),
        )
      }

      // Pending interest sidebar summary
      const pendingSummary = pending.length === 0
        ? el('p', { class: 'page-sub' }, 'No pending interest right now.')
        : el('div', { style: 'display:flex;flex-direction:column;gap:8px;' },
            ...pending.slice(0, 10).map(p => el('div', {
              style: 'padding:10px 12px;background:var(--bg);border-left:3px solid var(--gold);',
            },
              el('div', { style: 'font-size:13px;color:var(--ink);font-weight:500;' }, `${p.first_name} - ${p.wood_preference}`),
              el('div', { style: 'font-size:11px;color:var(--muted);' }, p.email),
              p.why_message ? el('div', { style: 'font-size:12px;color:var(--text);margin-top:6px;font-family:Georgia,serif;font-style:italic;' }, p.why_message) : null,
            )),
          )

      renderShell(el('div', {},
        el('h1', { class: 'page-title' }, 'Watches'),
        el('p', { class: 'page-sub' }, `Every number 1-300 in the first edition. Colored cells are still available. Faded cells with strikethrough numbers are reserved (hover or click for details).`),

        el('div', { class: 'stats-row' },
          el('div', { class: 'stat' }, el('div', { class: 'stat-label' }, 'Total reserved'), el('div', { class: 'stat-value' }, String(assigned.length))),
          el('div', { class: 'stat' }, el('div', { class: 'stat-label' }, 'Available'), el('div', { class: 'stat-value' }, String(300 - assigned.length))),
          el('div', { class: 'stat' }, el('div', { class: 'stat-label' }, 'Pending interest'), el('div', { class: 'stat-value' }, String(pending.length))),
        ),

        renderWoodSection('hinoki'),
        renderWoodSection('ebony'),
        renderWoodSection('padauk'),

        el('h2', { style: `font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;font-size:22px;color:var(--ink);margin:36px 0 12px;` }, 'Pending interest (recent)'),
        pendingSummary,
      ))
    }

    function showWatchDetail(a, woodLabel, n) {
      const modal = el('div', { class: 'modal-bg', onclick: (e) => { if (e.target.classList.contains('modal-bg')) modal.remove() } },
        el('div', { class: 'modal' },
          el('h3', {}, `${woodLabel} #${n}`),
          el('div', { style: 'margin-bottom:16px;' },
            el('div', { style: 'font-family:Georgia,serif;font-size:18px;color:var(--ink);margin-bottom:4px;' }, a.first_name),
            el('div', { style: 'font-size:13px;color:var(--muted);' }, a.email),
          ),
          a.notes ? el('div', {
            style: 'padding:14px 16px;background:var(--bg);border-left:3px solid var(--gold);margin-bottom:16px;font-family:Georgia,serif;font-size:14px;',
          }, a.notes) : null,
          a.subscribed_at ? el('div', { style: 'font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:16px;' }, `Reserved ${a.subscribed_at.slice(0, 10)}`) : null,
          el('div', { class: 'modal-actions' },
            el('button', { onclick: () => modal.remove() }, 'Close'),
          ),
        )
      )
      document.body.appendChild(modal)
    }

    // ---- Render dispatch ----
    function render() {
      if (currentView === 'subscribers') renderSubscribers()
      else if (currentView === 'reservations') renderReservations()
      else if (currentView === 'watches') renderWatches()
      else if (currentView === 'broadcasts') renderBroadcasts()
      else if (currentView === 'welcome') renderWelcome()
      else if (currentView === 'stories') renderStories()
      else if (currentView === 'votes') renderVotes()
      else if (currentView === 'timeline') renderTimeline()
    }

    // ---- Utils ----
    function debounce(fn, ms) {
      let t
      return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms) }
    }

    // ---- Boot ----
    ;(async () => {
      const session = await api('/session').catch(() => ({ authenticated: false }))
      if (session && session.authenticated) {
        const hash = window.location.hash.replace('#', '')
        if (VIEWS.includes(hash)) currentView = hash
        render()
      } else {
        showLogin()
      }
    })()
  </script>
</body>
</html>
