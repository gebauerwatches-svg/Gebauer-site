<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Gebauer Admin</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <style>
    :root {
      --ink: #14111c;
      --gold: #d4a62a;
      --gold-soft: rgba(212, 166, 42, 0.12);
      --bg: #f5f3ef;
      --card: #ffffff;
      --border: #e8e2d6;
      --text: #1a1a1a;
      --muted: #888;
      --danger: #b03030;
      --ok: #2a6b52;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Inter', Arial, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; }
    a { color: var(--gold); text-decoration: none; }
    a:hover { text-decoration: underline; }
    button {
      font-family: inherit; font-size: 13px; padding: 8px 16px; border: 1px solid var(--border);
      background: var(--card); color: var(--text); cursor: pointer; transition: all 0.15s;
    }
    button:hover { border-color: var(--gold); }
    button.primary { background: var(--ink); color: white; border-color: var(--ink); }
    button.primary:hover { background: var(--gold); border-color: var(--gold); color: var(--ink); }
    button.danger { color: var(--danger); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    input, textarea, select {
      font-family: inherit; font-size: 14px; padding: 10px 12px;
      border: 1px solid var(--border); background: var(--card); color: var(--text); width: 100%;
    }
    input:focus, textarea:focus { outline: none; border-color: var(--gold); }
    textarea { resize: vertical; min-height: 120px; font-family: 'Georgia', serif; }
    label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em; }
    .field { margin-bottom: 12px; }

    /* Login screen */
    .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .login-card { background: var(--card); padding: 32px; max-width: 380px; width: 100%; border: 1px solid var(--border); }
    .login-card h1 { font-family: 'Georgia', serif; font-weight: normal; font-size: 24px; color: var(--ink); margin-bottom: 8px; }
    .login-card p { color: var(--muted); font-size: 13px; margin-bottom: 20px; }

    /* App layout */
    .app { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
    .sidebar { background: var(--ink); color: white; padding: 24px 0; }
    .sidebar h2 { font-family: 'Georgia', serif; font-weight: normal; font-size: 18px; padding: 0 24px 24px; color: var(--gold); letter-spacing: 0.05em; }
    .sidebar nav { display: flex; flex-direction: column; }
    .sidebar a {
      color: rgba(255,255,255,0.7); padding: 10px 24px; font-size: 14px;
      border-left: 3px solid transparent; transition: all 0.15s; text-decoration: none;
    }
    .sidebar a:hover { color: white; background: rgba(255,255,255,0.05); }
    .sidebar a.active { color: var(--gold); border-left-color: var(--gold); background: rgba(212,166,42,0.05); }
    .sidebar .logout { margin-top: 32px; padding: 10px 24px; color: var(--muted); font-size: 12px; background: none; border: none; cursor: pointer; text-align: left; }

    main { padding: 32px; max-width: 1100px; }
    .page-title { font-family: 'Georgia', serif; font-weight: normal; font-size: 28px; color: var(--ink); margin-bottom: 4px; }
    .page-sub { color: var(--muted); font-size: 14px; margin-bottom: 24px; }

    /* Stats row */
    .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 24px; }
    .stat { background: var(--card); padding: 16px; border: 1px solid var(--border); }
    .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .stat-value { font-family: 'Georgia', serif; font-size: 28px; color: var(--ink); margin-top: 4px; }

    /* Subscriber table */
    .toolbar { display: flex; gap: 12px; margin-bottom: 16px; align-items: center; }
    .toolbar input { flex: 1; }
    table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--border); }
    th { background: var(--bg); padding: 10px 12px; text-align: left; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
    td { padding: 10px 12px; border-top: 1px solid var(--border); font-size: 13px; }
    tbody tr:hover { background: var(--gold-soft); }
    .status-pill { display: inline-block; padding: 2px 8px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; }
    .status-active { background: rgba(42,107,82,0.1); color: var(--ok); }
    .status-unsubscribed { background: rgba(176,48,48,0.1); color: var(--danger); }

    /* Modal */
    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 24px; }
    .modal { background: var(--card); padding: 24px; max-width: 480px; width: 100%; max-height: 90vh; overflow: auto; }
    .modal h3 { font-family: 'Georgia', serif; font-weight: normal; font-size: 20px; margin-bottom: 16px; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }

    /* Broadcast composer */
    .composer { background: var(--card); padding: 24px; border: 1px solid var(--border); margin-bottom: 24px; }
    .preview-pane { background: var(--bg); padding: 24px; border: 1px solid var(--border); }
    .preview-pane iframe { width: 100%; min-height: 500px; border: none; background: white; }

    /* Story card */
    .story-card { background: var(--card); padding: 16px; border: 1px solid var(--border); margin-bottom: 10px; }
    .story-meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
    .story-text { font-family: 'Georgia', serif; font-size: 14px; color: var(--text); margin-bottom: 8px; }
    .story-actions { display: flex; gap: 6px; }

    .error { color: var(--danger); font-size: 13px; margin-top: 8px; }
    .ok { color: var(--ok); font-size: 13px; margin-top: 8px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div id="app"><p style="padding:24px;color:var(--muted);">Loading...</p></div>

  <script>
    // ---- API helpers ----
    async function api(path, opts = {}) {
      const resp = await fetch(`/admin/api${path}`, {
        ...opts,
        headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) },
        credentials: 'same-origin',
      })
      const ct = resp.headers.get('content-type') || ''
      if (!ct.includes('application/json')) {
        return { error: `Non-JSON response (${resp.status})` }
      }
      const data = await resp.json()
      if (resp.status === 401) { showLogin('Session expired. Sign in again.'); throw new Error('unauth') }
      return data
    }
    const $ = (q, p = document) => p.querySelector(q)
    const $$ = (q, p = document) => Array.from(p.querySelectorAll(q))
    const el = (tag, attrs = {}, ...children) => {
      const e = document.createElement(tag)
      for (const [k, v] of Object.entries(attrs)) {
        if (k === 'class') e.className = v
        else if (k === 'html') e.innerHTML = v
        else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2), v)
        else if (v === null || v === undefined || v === false) continue
        else e.setAttribute(k, v)
      }
      for (const c of children) {
        if (c == null || c === false) continue
        e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c)
      }
      return e
    }

    // ---- Router ----
    const VIEWS = ['subscribers', 'reservations', 'watches', 'broadcasts', 'welcome', 'stories', 'votes', 'timeline']
    let currentView = 'subscribers'
    let pendingReservationsCount = 0  // for nav badge

    async function refreshPendingCount() {
      try {
        const data = await api('/reservations')
        pendingReservationsCount = (data && data.counts && data.counts.pending) || 0
      } catch { pendingReservationsCount = 0 }
    }

    function navigate(view) {
      currentView = view
      window.location.hash = view
      render()
    }
    window.addEventListener('hashchange', () => {
      const v = window.location.hash.replace('#', '')
      if (VIEWS.includes(v)) { currentView = v; render() }
    })

    // ---- Auth ----
    async function showLogin(message = '') {
      const app = $('#app')
      app.innerHTML = ''
      app.appendChild(el('div', { class: 'login-wrap' },
        el('form', { class: 'login-card', onsubmit: handleLogin },
          el('h1', {}, 'Gebauer Admin'),
          el('p', {}, message || 'Sign in to manage subscribers, broadcasts, stories, and votes.'),
          el('div', { class: 'field' },
            el('label', {}, 'Password'),
            el('input', { type: 'password', id: 'admin-pass', autofocus: 'true', required: 'true' }),
          ),
          el('button', { type: 'submit', class: 'primary' }, 'Sign in'),
          el('p', { class: 'error hidden', id: 'login-error' }, ''),
        )
      ))
    }

    async function handleLogin(e) {
      e.preventDefault()
      const pass = $('#admin-pass').value
      const errEl = $('#login-error')
      errEl.classList.add('hidden')
      const data = await api('/login', { method: 'POST', body: JSON.stringify({ password: pass }) }).catch(() => null)
      if (data && data.ok) {
        currentView = window.location.hash.replace('#', '') || 'subscribers'
        if (!VIEWS.includes(currentView)) currentView = 'subscribers'
        render()
      } else {
        errEl.textContent = (data && data.error) || 'Login failed.'
        errEl.classList.remove('hidden')
      }
    }

    async function handleLogout() {
      await fetch('/admin/api/logout', { method: 'POST', credentials: 'same-origin' })
      showLogin('Signed out.')
    }

    // ---- Layout shell ----
    function renderShell(contentNode) {
      const app = $('#app')
      app.innerHTML = ''
      const navItem = (id, label, badgeCount) => {
        const children = [document.createTextNode(label)]
        if (badgeCount && badgeCount > 0) {
          children.push(el('span', {
            style: 'display:inline-block;margin-left:8px;min-width:20px;height:20px;padding:0 6px;background:#d94040;color:#fff;border-radius:10px;font-size:11px;font-weight:600;text-align:center;line-height:20px;vertical-align:middle;',
          }, String(badgeCount)))
        }
        return el('a', {
          href: `#${id}`,
          class: currentView === id ? 'active' : '',
          onclick: (e) => { e.preventDefault(); navigate(id) },
        }, ...children)
      }
      app.appendChild(el('div', { class: 'app' },
        el('aside', { class: 'sidebar' },
          el('h2', {}, 'GEBAUER'),
          el('nav', {},
            navItem('subscribers', 'Subscribers'),
            navItem('reservations', 'Reservations', pendingReservationsCount),
            navItem('watches', 'Watches'),
            navItem('broadcasts', 'Broadcasts'),
            navItem('welcome', 'Welcome email'),
            navItem('stories', 'Stories'),
            navItem('votes', 'Wood votes'),
            navItem('timeline', 'Timeline'),
          ),
          el('button', { class: 'logout', onclick: handleLogout }, 'Sign out'),
        ),
        el('main', {}, contentNode),
      ))
    }

    // ---- Subscribers view ----
    async function renderSubscribers() {
      renderShell(el('div', {}, el('p', { class: 'page-sub' }, 'Loading...')))
      const data = await api('/subscribers?limit=300').catch(() => ({ subscribers: [], total: 0, active: 0 }))
      const subs = data.subscribers || []

      const searchInput = el('input', {
        type: 'text', placeholder: 'Search email or name...', id: 'subs-search',
        oninput: debounce(async (e) => {
          const q = e.target.value
          const d = await api(`/subscribers?q=${encodeURIComponent(q)}&limit=300`)
          renderSubsTable(d.subscribers || [])
        }, 200),
      })

      const tableWrap = el('div', { id: 'subs-table-wrap' })
      const addBtn = el('button', { class: 'primary', onclick: showAddSubscriberModal }, '+ Add')

      function momentSnippet(s) {
        if (!s.stories) return el('span', { style: 'color:var(--muted);' }, '—')
        const all = s.stories.split('||SEP||').filter(Boolean)
        const first = all[0] || ''
        const snippet = first.length > 50 ? first.slice(0, 50) + '...' : first
        const label = all.length > 1 ? `${snippet} (+${all.length - 1} more)` : snippet
        return el('a', {
          href: '#', style: 'color:var(--gold);',
          onclick: (e) => { e.preventDefault(); showMomentModal(s, all) },
        }, label)
      }

      function renderSubsTable(rows) {
        const tableEl = el('table', {},
          el('thead', {}, el('tr', {},
            el('th', {}, 'Name'),
            el('th', {}, 'Email'),
            el('th', {}, 'Moment'),
            el('th', {}, 'Watch #'),
            el('th', {}, 'Status'),
            el('th', {}, 'Joined'),
            el('th', {}, ''),
          )),
          el('tbody', {}, ...rows.map(s => el('tr', {},
            el('td', {}, s.first_name || ''),
            el('td', {}, s.email),
            el('td', { style: 'max-width:280px;' }, momentSnippet(s)),
            el('td', {}, s.waitlist_position === 9999 ? '—' : `#${s.waitlist_position}`),
            el('td', {}, el('span', { class: `status-pill status-${s.status}` }, s.status)),
            el('td', {}, (s.subscribed_at || '').slice(0, 10)),
            el('td', {}, el('button', { onclick: () => showEditSubscriberModal(s) }, 'Edit')),
          ))),
        )
        tableWrap.innerHTML = ''
        tableWrap.appendChild(rows.length === 0 ? el('p', { class: 'page-sub' }, 'No subscribers match.') : tableEl)
      }
      renderSubsTable(subs)

      renderShell(el('div', {},
        el('h1', { class: 'page-title' }, 'Subscribers'),
        el('p', { class: 'page-sub' }, `${data.active} active, ${data.total} total. Search matches email, name, or moment text.`),
        el('div', { class: 'stats-row' },
          el('div', { class: 'stat' }, el('div', { class: 'stat-label' }, 'Total'), el('div', { class: 'stat-value' }, String(data.total))),
          el('div', { class: 'stat' }, el('div', { class: 'stat-label' }, 'Active'), el('div', { class: 'stat-value' }, String(data.active))),
          el('div', { class: 'stat' }, el('div', { class: 'stat-label' }, 'Watch numbers reserved'), el('div', { class: 'stat-value' }, String(subs.filter(s => s.waitlist_position !== 9999).length))),
          el('div', { class: 'stat' }, el('div', { class: 'stat-label' }, 'Moments'), el('div', { class: 'stat-value' }, String(data.stories_total || 0))),
        ),
        el('div', { class: 'toolbar' }, searchInput, addBtn),
        tableWrap,
      ))
    }

    function showMomentModal(s, stories) {
      const modal = el('div', { class: 'modal-bg', onclick: (e) => { if (e.target.classList.contains('modal-bg')) modal.remove() } },
        el('div', { class: 'modal' },
          el('h3', {}, `${s.first_name || 'Subscriber'} moment${stories.length > 1 ? 's' : ''}`),
          el('p', { class: 'page-sub', style: 'margin-bottom:16px;' }, s.email),
          ...stories.map((text, i) => el('div', { class: 'story-card', style: 'margin-bottom:10px;' },
            stories.length > 1 ? el('div', { class: 'story-meta' }, el('span', {}, `Moment ${i + 1} of ${stories.length}`)) : null,
            el('p', { class: 'story-text' }, text),
          )),
          el('div', { class: 'modal-actions' },
            el('button', { onclick: () => modal.remove() }, 'Close'),
          ),
        )
      )
      document.body.appendChild(modal)
    }

    function showAddSubscriberModal() {
      const modal = el('div', { class: 'modal-bg', onclick: (e) => { if (e.target.classList.contains('modal-bg')) modal.remove() } },
        el('form', { class: 'modal', onsubmit: async (e) => {
          e.preventDefault()
          const errEl = $('#add-err', modal)
          errEl.classList.add('hidden')
          const watchNumRaw = $('#add-watchnum', modal).value
          const watchNum = watchNumRaw ? parseInt(watchNumRaw, 10) : undefined
          const data = await api('/subscribers', {
            method: 'POST',
            body: JSON.stringify({
              email: $('#add-email', modal).value,
              first_name: $('#add-name', modal).value,
              notes: $('#add-notes', modal).value,
              waitlist_position: watchNum,
            }),
          })
          if (data.ok) { modal.remove(); renderSubscribers() }
          else { errEl.textContent = data.error || 'Could not add.'; errEl.classList.remove('hidden') }
        } },
          el('h3', {}, 'Add subscriber'),
          el('div', { class: 'field' }, el('label', {}, 'Email'), el('input', { type: 'email', id: 'add-email', required: 'true' })),
          el('div', { class: 'field' }, el('label', {}, 'First name'), el('input', { type: 'text', id: 'add-name', required: 'true' })),
          el('div', { class: 'field' }, el('label', {}, 'Watch # (1-300, blank = none)'), el('input', { type: 'number', id: 'add-watchnum', min: '1', max: '300' })),
          el('div', { class: 'field' }, el('label', {}, 'Notes (optional)'), el('input', { type: 'text', id: 'add-notes' })),
          el('p', { class: 'error hidden', id: 'add-err' }, ''),
          el('div', { class: 'modal-actions' },
            el('button', { type: 'button', onclick: () => modal.remove() }, 'Cancel'),
            el('button', { type: 'submit', class: 'primary' }, 'Add'),
          ),
        )
      )
      document.body.appendChild(modal)
    }

    function showEditSubscriberModal(s) {
      const modal = el('div', { class: 'modal-bg', onclick: (e) => { if (e.target.classList.contains('modal-bg')) modal.remove() } },
        el('form', { class: 'modal', onsubmit: async (e) => {
          e.preventDefault()
          const errEl = $('#edit-err', modal)
          errEl.classList.add('hidden')
          const data = await api(`/subscriber/${s.id}`, {
            method: 'PUT',
            body: JSON.stringify({
              first_name: $('#edit-name', modal).value,
              waitlist_position: parseInt($('#edit-pos', modal).value, 10) || 9999,
              status: $('#edit-status', modal).value,
              // The wood dropdown is the source of truth. There is no wood column
              // on subscribers, so the wood has to live in notes, which is what
              // detectWood() reads. Any existing wood word is stripped first,
              // because detectWood checks cherry before padauk and notes holding
              // both would silently resolve to the wrong one.
              notes: (() => {
                const w = $('#edit-wood', modal).value
                let n = $('#edit-notes', modal).value.trim()
                if (!w) return n
                n = n.replace(/\b(cherry|hinoki|ebony|padauk)\b/gi, '').replace(/\s{2,}/g, ' ').trim()
                return n ? `${w.toUpperCase()} ${n}` : w.toUpperCase()
              })(),
            }),
          })
          if (data.ok) { modal.remove(); renderSubscribers() }
          else { errEl.textContent = data.error || 'Could not save.'; errEl.classList.remove('hidden') }
        } },
          el('h3', {}, `Edit ${s.email}`),
          el('div', { class: 'field' }, el('label', {}, 'First name'), el('input', { type: 'text', id: 'edit-name', value: s.first_name || '' })),
          el('div', { class: 'field' },
            el('label', {}, 'Watch # within its wood (1-100, blank = none)'),
            el('input', { type: 'number', id: 'edit-pos', value: s.waitlist_position === 9999 ? '' : s.waitlist_position }),
            // The wood is resolved from the Notes field first, and only falls back
            // to the number range (1-100 cherry, 101-200 ebony, 201-300 padauk) if
            // no wood is named there. So a bare "16" silently becomes CHERRY 016.
          ),
          el('div', { class: 'field' },
            el('label', {}, 'Wood'),
            (() => {
              const cur = (s.notes || '').toLowerCase()
              const sel = cur.includes('padauk') ? 'padauk'
                        : cur.includes('ebony') ? 'ebony'
                        : (cur.includes('cherry') || cur.includes('hinoki')) ? 'cherry' : ''
              return el('select', { id: 'edit-wood' },
                el('option', { value: '', selected: sel === '' ? 'true' : null }, 'No wood set'),
                el('option', { value: 'cherry', selected: sel === 'cherry' ? 'true' : null }, 'Cherry ($299)'),
                el('option', { value: 'ebony', selected: sel === 'ebony' ? 'true' : null }, 'Black Ebony ($339)'),
                el('option', { value: 'padauk', selected: sel === 'padauk' ? 'true' : null }, 'African Padauk ($375)'),
              )
            })(),
            el('div', { style: 'font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.55;' },
               'Picking a wood here writes it into Notes for you. You do not need to type it.'),
          ),
          el('div', { class: 'field' }, el('label', {}, 'Status'),
            el('select', { id: 'edit-status' },
              el('option', { value: 'active', selected: s.status === 'active' ? 'true' : null }, 'active'),
              el('option', { value: 'unsubscribed', selected: s.status === 'unsubscribed' ? 'true' : null }, 'unsubscribed'),
              el('option', { value: 'bounced', selected: s.status === 'bounced' ? 'true' : null }, 'bounced'),
            ),
          ),
          el('div', { class: 'field' },
            el('label', {}, 'Notes'),
            el('input', { type: 'text', id: 'edit-notes', value: s.notes || '', placeholder: 'e.g. reserved by email, Aug 2026' }),
          ),
          el('p', { class: 'error hidden', id: 'edit-err' }, ''),
          el('div', { class: 'modal-actions' },
            el('button', { type: 'button', class: 'danger', onclick: async () => {
              if (!confirm(`Permanently delete ${s.email}? This cannot be undone.`)) return
              await api(`/subscriber/${s.id}`, { method: 'DELETE' })
              modal.remove(); renderSubscribers()
            } }, 'Delete'),
            el('button', { type: 'button', onclick: () => modal.remove() }, 'Cancel'),
            el('button', { type: 'submit', class: 'primary' }, 'Save'),
          ),
        )
      )
      document.body.appendChild(modal)
    }

    // ---- Broadcasts view ----
    async function renderBroadcasts() {
      renderShell(el('div', {}, el('p', { class: 'page-sub' }, 'Loading...')))
      const data = await api('/broadcasts').catch(() => ({ broadcasts: [] }))
      const history = data.broadcasts || []

      // A broadcast cannot be recalled, so sending is gated on three things:
      // you must have previewed THIS exact subject and body, you must confirm a
      // summary that includes the real recipient count, and you must type SEND.
      // Editing after previewing invalidates the preview.
      let previewedKey = null
      const bcKey = (subj, body) => subj + '\u0000' + body

      // Drafts survive a reload. The composer used to lose everything on any
      // refresh, which matters because refreshing is exactly what you do to pick
      // up a code change, and retyping a long email is how mistakes get in.
      const DRAFT_KEY = 'gebauer_broadcast_draft'
      const loadDraft = () => { try { return JSON.parse(localStorage.getItem(DRAFT_KEY)) || {} } catch { return {} } }
      const saveDraft = () => {
        try {
          localStorage.setItem(DRAFT_KEY, JSON.stringify({
            subject: $('#bc-subject').value, body: $('#bc-body').value,
          }))
        } catch {}
      }
      const clearDraft = () => { try { localStorage.removeItem(DRAFT_KEY) } catch {} }
      const draft = loadDraft()

      const composer = el('div', { class: 'composer' },
        el('h3', { class: 'page-title', style: 'font-size:20px;margin-bottom:12px;' }, 'New broadcast'),
        el('div', { class: 'field' },
          el('label', {}, 'Subject'),

            const data = await api('/broadcasts', { method: 'POST', body: JSON.stringify({ action: 'preview', subject, body }) })

            previewEl.innerHTML = ''

            // Layer 1: you must have previewed exactly what you are about to send.
            if (previewedKey !== bcKey(subject, body)) {
              return alert(
                previewedKey === null
                  ? 'Preview it first.\n\nClick Preview and read the email the way it will actually arrive.'
                  : 'You edited it after previewing.\n\nClick Preview again and re-read it before sending.'
              )
            }

            // Layer 2: confirm against the real recipient count, not "all subscribers".
            const subsData = await api('/subscribers?limit=300').catch(() => null)
            const count = subsData && subsData.subscribers
              ? subsData.subscribers.filter(x => x.status === 'active').length
              : null
            const firstLine = (body.trim().split('\n').find(l => l.trim()) || '').slice(0, 90)
            const who = count === null ? 'every active subscriber' : `${count} people`
            if (!confirm(

              `Subject:  ${subject}\n` +
              `Opens:    ${firstLine}\n\n` +
              `Once it goes out it cannot be recalled or edited.`
            )) return

            // Layer 3: type it out.
            const conf = prompt(`Last check. Type SEND to email ${who}.`)

            sendBtn.disabled = true; sendBtn.textContent = 'Sending...'
            const data = await api('/broadcasts', { method: 'POST', body: JSON.stringify({ action: 'send', subject, body }) })

            if (data.error) { alert('Error: ' + data.error); return }
            previewedKey = null

            alert(`Done. Sent: ${data.sent}, Failed: ${data.failed}.`)
            renderBroadcasts()
          } }, 'Send'),

    // ---- Reservations view ----
    // View mode: 'cards' (detailed, current) or 'batch' (compact table
    // with checkboxes, bulk actions, and priority scoring). Persist
    // in localStorage so it survives navigations.
    let reservationsViewMode = localStorage.getItem('resView') || 'cards'
    let batchSelected = new Set()  // reservation IDs selected via checkbox

    // Priority score: helps Liam surface the reservations most worth
    // reviewing first when there are many pending. Simple heuristic:
    //   +2 if they picked a specific number (more committed)
    //   +2 if they wrote a why_message (took time)
    //   +1 if why_message > 100 chars (took MORE time)
    //   +1 per week they've been pending (older = more urgent)
    function reservationScore(r) {
      let score = 0
      if (r.preferred_position) score += 2
      if (r.why_message) score += 2
      if (r.why_message && r.why_message.length > 100) score += 1
      if (r.submitted_at) {
        const days = (Date.now() - new Date(r.submitted_at).getTime()) / (1000 * 60 * 60 * 24)
        score += Math.min(3, Math.floor(days / 7))  // cap at +3
      }
      return score
    }
    function scoreDot(score) {
      const color = score >= 5 ? '#3aa06d' : score >= 3 ? '#c4952a' : '#8a8a8a'
      return el('span', {
        style: `display:inline-block;width:8px;height:8px;border-radius:50%;background:${color};`,
        title: `Priority score: ${score}`,
      })
    }

    // Auto-assign zone for reservers who did NOT pick a specific number.
    // Skips both ends of the range:
    //   #1-10:   strategic hold (never auto-assigned; reserved for founder/family/press)
    //   #91-100: reserved for people who specifically want "last of the run"
    //   #11-90:  auto-assign zone (works down from #90)
    // If the middle zone is depleted, falls back to expanding into
    // the top range #100-91 as a safety net.
    const AUTO_ASSIGN_TOP = 90     // start from here, work down
    const AUTO_ASSIGN_BOTTOM = 11  // don't dip into strategic hold
    const RESERVED_TOP_START = 91  // fallback range if middle depleted

    // `claimed` holds numbers handed out earlier in the SAME assignment pass.
    // Without it this function only sees what is already in the DB, so two
    // people who did not pick a number both got the same one.
    function lastAvailableInWood(availData, wood, claimed) {
      const reserved = new Set((availData && availData[wood]) || [])
      const pending = new Set((availData && availData.pending && availData.pending[wood]) || [])
      const hold = new Set((availData && availData.strategic_hold && availData.strategic_hold[wood]) || [])
      const isOpen = (n) => !reserved.has(n) && !pending.has(n) && !hold.has(n) && !(claimed && claimed.has(n))
      // Middle zone first
      for (let n = AUTO_ASSIGN_TOP; n >= AUTO_ASSIGN_BOTTOM; n--) {
        if (isOpen(n)) return n
      }
      // Fallback: expand into the top-reserved range so no-preference
      // reservers still get a watch when middle is depleted
      for (let n = 100; n >= RESERVED_TOP_START; n--) {
        if (isOpen(n)) return n
      }
      return null  // fully sold out in this wood
    }

    // Every still-open number in a wood, so a specific one can be picked from a
    // dropdown instead of only accepting the auto-assigned suggestion. The
    // strategic hold (1-10) is INCLUDED but flagged, because those are Liam's
    // to give away deliberately - that is the whole point of holding them.
    function availableNumbers(availData, wood) {
      const taken = new Set([
        ...((availData && availData[wood]) || []),
        ...((availData && availData.pending && availData.pending[wood]) || []),
      ])
      const held = new Set((availData && availData.strategic_hold && availData.strategic_hold[wood]) || [])
      const out = []
      for (let n = 1; n <= 100; n++) if (!taken.has(n)) out.push({ n, held: held.has(n) })
      return out
    }

    async function renderReservations() {
      renderShell(el('div', {}, el('p', { class: 'page-sub' }, 'Loading...')))
      const [data, avail] = await Promise.all([
        api('/reservations').catch(() => ({ reservations: [], counts: {} })),
        fetch('/api/availability').then(r => r.ok ? r.json() : {}).catch(() => ({})),
      ])
      const items = data.reservations || []
      const counts = data.counts || {}

      // One auto-number per person who did not pick one, all distinct.
      // Earliest signup is assigned first. Numbers still walk down from 90 so
      // the low ones stay free for people who ask for a specific number.
      function buildAutoAssignments(availData, reservations) {
        const claimed = {}
        const out = new Map()
        const queue = reservations
          .filter(r => !r.preferred_position && ['cherry', 'hinoki', 'ebony', 'padauk'].includes(r.wood_preference))
          .sort((a, b) => String(a.submitted_at || '').localeCompare(String(b.submitted_at || '')))
        for (const r of queue) {
          const wood = r.wood_preference === 'hinoki' ? 'cherry' : r.wood_preference
          if (!claimed[wood]) claimed[wood] = new Set()
          const n = lastAvailableInWood(availData, wood, claimed[wood])
          if (n) { claimed[wood].add(n); out.set(r.id, n) }
        }
        return out
      }
      const autoAssign = buildAutoAssignments(avail, items)

      const WOOD_LABEL = {
        cherry: 'Cherry ($299)', hinoki: 'Cherry ($299)', ebony: 'Black Ebony ($339)',
        padauk: 'African Padauk ($375)', unsure: 'Not sure',
      }

      function statusPill(s) {
        const colorMap = {
          pending: 'rgba(196,149,42,0.15);color:#c4952a',
          contacted: 'rgba(20,120,200,0.15);color:#40a0d0',
          converted: 'rgba(42,107,82,0.15);color:var(--ok)',
          declined: 'rgba(120,120,120,0.15);color:#888',
        }
        return el('span', {
          style: `display:inline-block;padding:3px 10px;font-size:11px;text-transform:uppercase;letter-spacing:0.06em;background:${colorMap[s] || colorMap.pending}`,
        }, s)
      }

      const WOOD_SHORT = { cherry: 'CHERRY', hinoki: 'CHERRY', ebony: 'EBONY', padauk: 'PADAUK', unsure: 'wood-TBD' }
      const list = items.length === 0
        ? el('p', { class: 'page-sub' }, 'No reservation interest yet. When someone submits the /reserve form, it will appear here.')
        : el('div', {}, ...items.map(r => {
            // Explicit request language: "Requested: CHERRY #100" or
            // "Requested: CHERRY (no number picked)"
            const wLabel = WOOD_SHORT[r.wood_preference] || r.wood_preference.toUpperCase()
            const requestLine = r.preferred_position
              ? `Requested: ${wLabel} #${String(r.preferred_position).padStart(3, '0')}`
              : `Requested: ${wLabel} (no specific number picked)`

            // Reserve action: only makes sense when they picked a specific number.
            // Uses confirm() as the "are you sure" safety net per Liam's decision
            // that confirm modals replace the need for an undo mechanism.
            // For reservers who picked a specific number: primary Reserve button
            // uses their picked number. For reservers who didn't pick, we
            // compute the LAST available number in their wood variant
            // (highest still-open number, working down from 100). That
            // preserves low/prime numbers for people who specifically want
            // them while still guaranteeing early reservers a watch.
            const autoNumber = autoAssign.get(r.id) || null

            async function doReserve(watchNum) {
              const label = `${wLabel} #${String(watchNum).padStart(3, '0')}`
              const ok = confirm(
                `Reserve ${label} for ${r.first_name}?\n\n` +
                `This locks in the watch number for them. Only 100 of this wood exist.\n\n` +
                `They will remain on the waitlist as a subscriber either way. This action is specifically about locking in the watch number.`
              )
              if (!ok) return
              let subscriberId = r.subscriber_id
              if (!subscriberId) {
                const subResp = await api('/subscribers', {
                  method: 'POST',
                  body: JSON.stringify({
                    email: r.email,
                    first_name: r.first_name,
                    notes: `Auto-added on reservation confirmation ${new Date().toISOString().slice(0, 10)}`,
                    waitlist_position: watchNum,
                  }),
                })
                if (!subResp.ok) {
                  alert('Could not reserve: ' + (subResp.error || 'unknown error'))
                  return
                }
                subscriberId = subResp.id
              } else {
                await api(`/subscribers/${subscriberId}`, {
                  method: 'PUT',
                  body: JSON.stringify({ waitlist_position: watchNum }),
                })
              }
              await api(`/reservation/${r.id}`, {
                method: 'PUT',
                body: JSON.stringify({ status: 'converted', subscriber_id: subscriberId }),
              })
              alert(`Reserved. ${r.first_name} now has ${label}.`)
              renderReservations()
            }

            // Primary reserve button:
            // - If they picked a specific number → reserve that one
            // - If not but wood is specified → reserve the last-available
            //   number in that wood (highest still-open, working down
            //   from 100). Preserves low/prime numbers for people who
            //   specifically request them.
            // - If wood is 'unsure' or sold out → fall back to modal
            // Number picker + reserve. The dropdown is the point: previously the
            // only options were "accept the number the system chose" or "Skip",
            // so giving someone a specific number (a collector asking for #16)
            // meant editing the record by hand.
            const woodKey = r.wood_preference === 'hinoki' ? 'cherry' : r.wood_preference
            let reserveBtn, numSelect = null
            const isConverted = r.status === 'converted'

            if (isConverted) {
              reserveBtn = el('div', {
                style: 'padding:8px 12px;background:rgba(42,107,82,0.15);color:var(--ok);font-size:13px;letter-spacing:0.04em;',
              }, `RESERVED${r.preferred_position ? ` \u00b7 ${wLabel} #${String(r.preferred_position).padStart(3, '0')}` : ''}`)
            } else if (['cherry', 'hinoki', 'ebony', 'padauk'].includes(r.wood_preference)) {
              const opts = availableNumbers(avail, woodKey)
              const preferred = r.preferred_position || autoNumber
              numSelect = el('select', { style: 'padding:7px 9px;font-size:13px;min-width:132px;' })
              if (!opts.length) numSelect.appendChild(el('option', {}, 'none left'))
              for (const { n, held } of opts) {
                const o = document.createElement('option')
                o.value = String(n)
                o.textContent = `#${String(n).padStart(3, '0')}${held ? '  (held)' : ''}${n === autoNumber ? '  \u2190 auto' : ''}`
                if (n === preferred) o.selected = true
                numSelect.appendChild(o)
              }
              const labelFor = (v) => `Reserve ${wLabel} #${String(v).padStart(3, '0')} for them`
              reserveBtn = el('button', {
                class: 'primary',
                onclick: () => { if (numSelect.value) doReserve(Number(numSelect.value)) },
                title: 'Pick any open number. Numbers 1-10 are your strategic hold and are marked (held) - they are yours to give away on purpose.',
              }, labelFor(numSelect.value || '?'))
              numSelect.addEventListener('change', () => { reserveBtn.textContent = labelFor(numSelect.value) })
            } else {
              reserveBtn = el('button', {
                onclick: () => showConvertReservation(r),
              }, 'Pick a watch # for them')
            }

            // Skip: they stay a subscriber (already on the waitlist from auto-add).
            // For old reservations that predated the auto-add change (July 14),
            // no subscriber row exists yet, so create one here on skip.
            const skipBtn = el('button', {
              onclick: async () => {
                const ok = confirm(
                  `Skip the watch-number request for ${r.first_name}?\n\n` +
                  `They stay on the waitlist as a subscriber, but the specific number they asked for stays available for someone else.`
                )
                if (!ok) return
                // Ensure a subscriber row exists (for pre-July-14 reservations)
                if (!r.subscriber_id) {
                  const subResp = await api('/subscribers', {
                    method: 'POST',
                    body: JSON.stringify({
                      email: r.email,
                      first_name: r.first_name,
                      notes: `Auto-added on skip ${new Date().toISOString().slice(0, 10)}. No watch # locked in.`,
                      // no waitlist_position - defaults to 9999 placeholder
                    }),
                  })
                  if (!subResp.ok && !(subResp.error || '').toLowerCase().includes('already')) {
                    alert('Could not add to waitlist: ' + (subResp.error || 'unknown error'))
                    return
                  }
                }
                await api(`/reservation/${r.id}`, {
                  method: 'PUT',
                  body: JSON.stringify({ status: 'declined' }),
                })
                renderReservations()
              },
            }, 'Skip watch # (stay on waitlist)')

            return el('div', {
              class: 'story-card',
              style: 'margin-bottom:12px;padding:18px 20px;',
            },
              el('div', { style: 'display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;gap:12px;flex-wrap:wrap;' },
                el('div', {},
                  el('div', { style: 'font-family:Georgia,serif;font-size:16px;color:var(--ink);margin-bottom:2px;' }, `${r.first_name}`),
                  el('div', { style: 'font-size:13px;color:var(--muted);' }, r.email),
                ),
                el('div', { style: 'display:flex;flex-direction:column;align-items:flex-end;gap:6px;' },
                  statusPill(r.status),
                  el('div', { style: 'font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;' }, (r.submitted_at || '').slice(0, 10)),
                ),
              ),
              el('div', { style: 'font-size:14px;color:var(--ink);margin-bottom:8px;font-weight:600;' }, requestLine),
              r.why_message ? el('div', {
                class: 'story-text',
                style: 'font-size:14px;color:var(--text);margin-bottom:12px;padding:12px 14px;background:var(--bg);border-left:3px solid var(--gold);',
              }, r.why_message) : null,
              r.notes ? el('div', { style: 'font-size:12px;color:var(--muted);margin-bottom:10px;font-style:italic;' }, `Note: ${r.notes}`) : null,
              el('div', { class: 'story-actions', style: 'gap:6px;flex-wrap:wrap;align-items:center;' },
                numSelect,
                reserveBtn,
                isConverted ? null : skipBtn,
                el('button', { onclick: () => showEditReservation(r) }, 'Follow up / edit'),
                el('button', {
                  onclick: async () => {
                    const notes = prompt('Notes on the conversation (optional):', r.notes || '')
                    if (notes === null) return
                    await api(`/reservation/${r.id}`, {
                      method: 'PUT',
                      body: JSON.stringify({ status: 'contacted', notes }),
                    })
                    renderReservations()
                  },
                }, 'Mark contacted'),
                el('button', {
                  class: 'danger',
                  onclick: async () => {
                    if (!confirm(`Delete this reservation request entirely?\n\nThis wipes the record. Use "Skip watch #" instead if you want to decline the number but keep the person on the waitlist.`)) return
                    await api(`/reservation/${r.id}`, { method: 'DELETE' })
                    renderReservations()
                  },
                }, 'Delete'),
              ),
            )
          }))

      // Build the batch view (compact table) if that mode is active.
      // Only shows PENDING reservations by default in batch mode - that's
      // what needs your attention. Card view shows everything.
      const pendingItems = items.filter(r => r.status === 'pending')
      const sortedByScore = [...pendingItems].sort((a, b) => reservationScore(b) - reservationScore(a))

      async function bulkReserve(ids) {
        const selected = pendingItems.filter(r => ids.has(r.id))
        if (!selected.length) return
        const summary = selected.map(r => {
          const w = WOOD_SHORT[r.wood_preference] || r.wood_preference.toUpperCase()
          const num = r.preferred_position
            ? String(r.preferred_position).padStart(3, '0')
            : `auto (${String(autoAssign.get(r.id) || '?').padStart(3, '0')})`
          return `- ${r.first_name}: ${w} #${num}`
        }).join('\n')
        const ok = confirm(
          `Reserve watches for ${selected.length} people?\n\n${summary}\n\nEach one locks in the watch number. Only 100 of each wood exist.`
        )
        if (!ok) return
        for (const r of selected) {
          const wood = r.wood_preference
          const num = r.preferred_position || autoAssign.get(r.id)
          if (!num) continue
          let subscriberId = r.subscriber_id
          if (!subscriberId) {
            const subResp = await api('/subscribers', {
              method: 'POST',
              body: JSON.stringify({
                email: r.email,
                first_name: r.first_name,
                notes: `Bulk-reserved on ${new Date().toISOString().slice(0, 10)}`,
                waitlist_position: num,
              }),
            })
            if (!subResp.ok) continue
            subscriberId = subResp.id
          } else {
            await api(`/subscribers/${subscriberId}`, {
              method: 'PUT',
              body: JSON.stringify({ waitlist_position: num }),
            })
          }
          await api(`/reservation/${r.id}`, {
            method: 'PUT',
            body: JSON.stringify({ status: 'converted', subscriber_id: subscriberId }),
          })
        }
        batchSelected.clear()
        renderReservations()
      }

      async function bulkSkip(ids) {
        const selected = pendingItems.filter(r => ids.has(r.id))
        if (!selected.length) return
        const ok = confirm(
          `Skip the watch requests for ${selected.length} people?\n\nThey stay on the waitlist as subscribers, but the specific numbers they asked for stay open for others.`
        )
        if (!ok) return
        for (const r of selected) {
          if (!r.subscriber_id) {
            await api('/subscribers', {
              method: 'POST',
              body: JSON.stringify({
                email: r.email,
                first_name: r.first_name,
                notes: `Auto-added on bulk skip ${new Date().toISOString().slice(0, 10)}. No watch # locked in.`,
              }),
            }).catch(() => {})
          }
          await api(`/reservation/${r.id}`, {
            method: 'PUT',
            body: JSON.stringify({ status: 'declined' }),
          })
        }
        batchSelected.clear()
        renderReservations()
      }

          const numLabel = r.preferred_position

                el('th', { style: 'padding:10px 8px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);' }, 'Name'),
                el('th', { style: 'padding:10px 8px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);' }, 'Requested'),
                el('th', { style: 'padding:10px 8px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);' }, 'Why'),

      },
        el('span', { class: 'bulk-count', style: 'font-size:14px;font-weight:600;' }, '0 selected'),
        el('button', {

        el('button', {

          onclick: () => bulkSkip(new Set(batchSelected)),
        }, 'Skip all selected'),
        el('button', {
          style: 'padding:8px 12px;font-size:13px;background:transparent;color:#fff;border:none;',
          onclick: () => { batchSelected.clear(); renderReservations() },
        }, '×'),

      const viewToggle = el('div', {
        style: 'display:flex;gap:8px;align-items:center;margin-bottom:20px;',
      },
        el('span', { style: 'font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;' }, 'View:'),
        el('button', {
          style: `padding:6px 14px;font-size:12px;background:${reservationsViewMode === 'cards' ? 'var(--purple)' : 'transparent'};color:${reservationsViewMode === 'cards' ? '#fff' : 'var(--ink)'};border:1px solid var(--purple);`,
          onclick: () => { reservationsViewMode = 'cards'; localStorage.setItem('resView', 'cards'); batchSelected.clear(); renderReservations() },
        }, 'Cards (detailed)'),
        el('button', {
          style: `padding:6px 14px;font-size:12px;background:${reservationsViewMode === 'batch' ? 'var(--purple)' : 'transparent'};color:${reservationsViewMode === 'batch' ? '#fff' : 'var(--ink)'};border:1px solid var(--purple);`,
          onclick: () => { reservationsViewMode = 'batch'; localStorage.setItem('resView', 'batch'); batchSelected.clear(); renderReservations() },
        }, `Batch (${pendingItems.length} pending)`),
      )

      const content = reservationsViewMode === 'batch' ? renderBatchTable() : list

      renderShell(el('div', {},
        el('h1', { class: 'page-title' }, 'Reservation interest'),
        el('p', { class: 'page-sub' }, 'Cold visitors who submitted the /reserve form. Reservations are expressions of interest, not guarantees. Review, then reserve or skip.'),
        el('div', { class: 'stats-row' },
          el('div', { class: 'stat' }, el('div', { class: 'stat-label' }, 'Pending'), el('div', { class: 'stat-value' }, String(counts.pending || 0))),
          el('div', { class: 'stat' }, el('div', { class: 'stat-label' }, 'Contacted'), el('div', { class: 'stat-value' }, String(counts.contacted || 0))),
          el('div', { class: 'stat' }, el('div', { class: 'stat-label' }, 'Converted'), el('div', { class: 'stat-value' }, String(counts.converted || 0))),
          el('div', { class: 'stat' }, el('div', { class: 'stat-label' }, 'Declined'), el('div', { class: 'stat-value' }, String(counts.declined || 0))),
        ),
        viewToggle,
        content,
        bulkBar,
      ))
    }

    function showConvertReservation(r) {
      // Pre-fill an Add Subscriber form with the reservation data.
      // Watch # left blank so Liam picks it explicitly.
      const WOOD_MAP = { cherry: 'Cherry', hinoki: 'Cherry', ebony: 'Ebony', padauk: 'Padauk', unsure: 'wood TBD' }
      const defaultNotes = `${WOOD_MAP[r.wood_preference] || 'Wood TBD'} - converted from reservation ${new Date().toISOString().slice(0, 10)}.${r.why_message ? ' Their why: "' + r.why_message.slice(0, 200) + '"' : ''}`
      const modal = el('div', { class: 'modal-bg', onclick: (e) => { if (e.target.classList.contains('modal-bg')) modal.remove() } },
        el('form', { class: 'modal', onsubmit: async (e) => {
          e.preventDefault()
          const errEl = $('#convert-err', modal)
          errEl.classList.add('hidden')
          const watchNumRaw = $('#convert-watchnum', modal).value
          const watchNum = watchNumRaw ? parseInt(watchNumRaw, 10) : undefined

          el('div', { class: 'field' }, el('label', {}, 'First name'), el('input', { type: 'text', id: 'convert-name', value: r.first_name, required: 'true' })),
          el('div', { class: 'field' }, el('label', {}, 'Email (read-only)'), el('input', { type: 'email', value: r.email, disabled: 'true' })),
          el('div', { class: 'field' }, el('label', {}, `Watch # (1-100 within ${WOOD_MAP[r.wood_preference] || 'wood'})`), el('input', { type: 'number', id: 'convert-watchnum', min: '1', max: '300', value: r.preferred_position || '', placeholder: r.preferred_position ? '' : 'e.g. 12' })),
          el('div', { class: 'field' }, el('label', {}, 'Notes'), el('textarea', { id: 'convert-notes', style: 'min-height:80px', html: defaultNotes.replace(/</g, '&lt;') })),

    // ---- Watches view (per-variant grids) ----
    async function renderWatches() {
      renderShell(el('div', {}, el('p', { class: 'page-sub' }, 'Loading...')))
      const data = await api('/watches').catch(() => ({ assigned: [], pending: [] }))
      const assigned = data.assigned || []
      const pending = data.pending || []

      const WOODS = [
        { key: 'cherry', label: 'Cherry', color: '#e6c9a8', border: '#c49a72' },
        { key: 'ebony', label: 'Black Ebony', color: '#3a3028', border: '#5a4d40' },
        { key: 'padauk', label: 'African Padauk', color: '#c46a3a', border: '#9c5028' },
      ]

      // Fallback wood if notes don't explicitly mention one:
      //   position 1-100 defaults to Cherry, 101-200 Ebony, 201-300 Padauk.
      // This only matters for subscribers who don't have a wood mentioned
      // in their notes column (old data from the pre-per-variant era).
      function fallbackWoodForPos(n) {
        if (n <= 100) return 'cherry'
        if (n <= 200) return 'ebony'
        return 'padauk'
      }

      // Build per-wood assignment maps: byWood[wood][positionWithinWood] = subscriber
      // For each assigned subscriber:
      //   - wood = notes hint if present, else fallback by position range
      //   - positionWithinWood:
      //       * if wood matches fallback: use raw position (mod 100 for ebony/padauk)
      //       * if wood is set via notes and doesn't match fallback: use raw
      //         position as-is (that's the number the customer chose within
      //         their wood variant)
      const byWood = { cherry: {}, ebony: {}, padauk: {} }
      for (const a of assigned) {
        const wood = a.wood_hint || fallbackWoodForPos(a.position)
        // Position within variant: if raw position is in the 1-100 range,
        // use as-is regardless of wood (that's the per-variant number the
        // customer picked). If raw position is 101-200 or 201-300 and it
        // fell in the fallback range for its wood, normalize to 1-100.
        let posInVariant = a.position
        if (posInVariant > 100 && posInVariant <= 200 && wood === 'ebony') posInVariant -= 100
        else if (posInVariant > 200 && posInVariant <= 300 && wood === 'padauk') posInVariant -= 200
        byWood[wood][posInVariant] = a
      }

      function cellForPos(n, sectionWood) {
        const a = byWood[sectionWood][n]
        const spec = WOODS.find(w => w.key === sectionWood) || WOODS[0]
        const isTaken = !!a
        const isDarkWood = sectionWood === 'ebony'

        // AVAILABLE = vibrant wood color (jumps out - "you can still get this")
        // RESERVED  = faded/dimmed with strikethrough number (visually clear it's off limits)
        let bg, color, border, opacity, decoration, label
        if (isTaken) {
          bg = '#eeeae2'
          color = 'rgba(80,72,60,0.55)'
          border = '1px dashed rgba(120,110,90,0.4)'
          opacity = '1'
          decoration = 'line-through'
        } else {
          bg = spec.color
          color = isDarkWood ? '#f0ece5' : '#1a1714'
          border = `1px solid ${spec.border}`
          opacity = '1'
          decoration = 'none'
        }

        const cell = el('div', {
          style: `
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Georgia, serif;
            font-size: 11px;
            font-weight: 500;
            cursor: ${isTaken ? 'pointer' : 'default'};
            background: ${bg};
            color: ${color};
            border: ${border};
            opacity: ${opacity};
            text-decoration: ${decoration};
            transition: transform 0.1s, background 0.15s;
            position: relative;
          `,
          title: isTaken
            ? `RESERVED: ${a.first_name} (${a.email}) - ${spec.label} #${n}${a.notes ? '\n' + a.notes : ''}`
            : `${spec.label} #${n} - AVAILABLE`,
        }, String(n))

        if (isTaken) {
          cell.addEventListener('click', () => showWatchDetail(a, spec.label, n))
          cell.addEventListener('mouseenter', () => {
            cell.style.transform = 'scale(1.15)'
            cell.style.zIndex = 10
            cell.style.background = '#dcd6c8'
            cell.style.color = '#1a1714'
          })
          cell.addEventListener('mouseleave', () => {
            cell.style.transform = ''
            cell.style.zIndex = ''
            cell.style.background = '#eeeae2'
            cell.style.color = 'rgba(80,72,60,0.55)'
          })
        }
        return cell
      }

      // Section renderer per wood (each wood is its own 1-100 grid)
      function renderWoodSection(woodKey) {
        const spec = WOODS.find(w => w.key === woodKey)
        const takenCount = Object.keys(byWood[woodKey]).length
        const cells = []
        for (let n = 1; n <= 100; n++) cells.push(cellForPos(n, woodKey))
        return el('section', { style: 'margin-bottom:36px;' },
          el('div', { style: 'display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;' },
            el('h2', { style: `font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;font-size:22px;color:var(--ink);margin:0;` }, spec.label),
            el('span', { style: 'font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;' }, `${100 - takenCount} still available out of 100`),
          ),
          el('div', {
            style: 'display:grid;grid-template-columns:repeat(10,1fr);gap:4px;',
          }, ...cells),
        )
      }

      // Pending interest sidebar summary
      const pendingSummary = pending.length === 0
        ? el('p', { class: 'page-sub' }, 'No pending interest right now.')
        : el('div', { style: 'display:flex;flex-direction:column;gap:8px;' },
            ...pending.slice(0, 10).map(p => el('div', {
              style: 'padding:10px 12px;background:var(--bg);border-left:3px solid var(--gold);',
            },
              el('div', { style: 'font-size:13px;color:var(--ink);font-weight:500;' }, `${p.first_name} - ${p.wood_preference}`),
              el('div', { style: 'font-size:11px;color:var(--muted);' }, p.email),
              p.why_message ? el('div', { style: 'font-size:12px;color:var(--text);margin-top:6px;font-family:Georgia,serif;font-style:italic;' }, p.why_message) : null,
            )),
          )

      renderShell(el('div', {},
        el('h1', { class: 'page-title' }, 'Watches'),
        el('p', { class: 'page-sub' }, `Every number 1-300 in the first edition. Colored cells are still available. Faded cells with strikethrough numbers are reserved (hover or click for details).`),

        el('div', { class: 'stats-row' },
          el('div', { class: 'stat' }, el('div', { class: 'stat-label' }, 'Total reserved'), el('div', { class: 'stat-value' }, String(assigned.length))),
          el('div', { class: 'stat' }, el('div', { class: 'stat-label' }, 'Available'), el('div', { class: 'stat-value' }, String(300 - assigned.length))),
          el('div', { class: 'stat' }, el('div', { class: 'stat-label' }, 'Pending interest'), el('div', { class: 'stat-value' }, String(pending.length))),
        ),

        renderWoodSection('cherry'),
        renderWoodSection('ebony'),
        renderWoodSection('padauk'),

        el('h2', { style: `font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;font-size:22px;color:var(--ink);margin:36px 0 12px;` }, 'Pending interest (recent)'),
        pendingSummary,
      ))
    }

    function showWatchDetail(a, woodLabel, n) {
      const modal = el('div', { class: 'modal-bg', onclick: (e) => { if (e.target.classList.contains('modal-bg')) modal.remove() } },
        el('div', { class: 'modal' },
          el('h3', {}, `${woodLabel} #${n}`),
          el('div', { style: 'margin-bottom:16px;' },
            el('div', { style: 'font-family:Georgia,serif;font-size:18px;color:var(--ink);margin-bottom:4px;' }, a.first_name),
            el('div', { style: 'font-size:13px;color:var(--muted);' }, a.email),
          ),
          a.notes ? el('div', {
            style: 'padding:14px 16px;background:var(--bg);border-left:3px solid var(--gold);margin-bottom:16px;font-family:Georgia,serif;font-size:14px;',
          }, a.notes) : null,
          a.subscribed_at ? el('div', { style: 'font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:16px;' }, `Reserved ${a.subscribed_at.slice(0, 10)}`) : null,
          el('div', { class: 'modal-actions' },
            el('button', { onclick: () => modal.remove() }, 'Close'),
          ),
        )
      )
      document.body.appendChild(modal)
    }

    // ---- Render dispatch ----
    async function render() {
      // Refresh the pending-reservation count on every render so the nav
      // badge stays current even as reservations come in or get converted.
      await refreshPendingCount()
      if (currentView === 'subscribers') renderSubscribers()
      else if (currentView === 'reservations') renderReservations()
      else if (currentView === 'watches') renderWatches()
      else if (currentView === 'broadcasts') renderBroadcasts()
      else if (currentView === 'welcome') renderWelcome()
      else if (currentView === 'stories') renderStories()
      else if (currentView === 'votes') renderVotes()
      else if (currentView === 'timeline') renderTimeline()
    }

    // ---- Utils ----
    function debounce(fn, ms) {
      let t
      return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms) }
    }

    // ---- Boot ----
    ;(async () => {
      const session = await api('/session').catch(() => ({ authenticated: false }))
      if (session && session.authenticated) {
        const hash = window.location.hash.replace('#', '')
        if (VIEWS.includes(hash)) currentView = hash
        render()
      } else {
        showLogin()
      }
    })()
  </script>
</body>
</html>
