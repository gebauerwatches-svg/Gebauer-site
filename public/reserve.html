<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F5F2ED" />
    <link rel="canonical" href="https://gebauerwatches.com/reserve" />
    <meta name="description" content="Reserve one of the first 300 Gebauer Watches. Real wood dials, made in Japan, individually numbered. Ships early 2027." />
    <meta name="keywords" content="reserve Gebauer Watch, wood dial watch reservation, limited edition watch reservation, milestone watch" />
    <meta property="og:title" content="Reserve a Gebauer Watch" />
    <meta property="og:description" content="Real wood dials, made in Japan, first edition of 300. Individually numbered." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://gebauerwatches.com/reserve" />
    <title>Reserve a Gebauer Watch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
      :root {
        --purple: #1E1A2E;
        --purple-soft: #5C5478;
        --gold: #C4952A;
        --gold-light: #D4A63A;
        --bg-cream: #F5F2ED;
        --bg-warm: #EFECE6;
        --bg-light: #FAF8F5;
        --text-dark: #1A1714;
        --text-warm: #4A443C;
        --text-muted: #6B6358;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'Georgia', 'Times New Roman', serif;
        background: var(--bg-cream);
        color: var(--text-warm);
        line-height: 1.7;
        min-height: 100vh;
        padding: 72px 24px 96px;
      }
      .container { max-width: 620px; margin: 0 auto; }

      .nav { font-family: 'Inter', sans-serif; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 56px; color: var(--gold); }
      .nav a { color: var(--gold); text-decoration: none; }
      .nav a:hover { color: var(--purple); }

      h1 {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-weight: 400;
        font-size: 48px;
        line-height: 1.15;
        color: var(--purple);
        margin: 0 0 14px;
        letter-spacing: -0.5px;
      }
      .subtitle {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-style: italic;
        font-size: 20px;
        color: var(--gold);
        margin-bottom: 44px;
      }
      p.intro {
        font-size: 17px;
        color: var(--text-warm);
        margin-bottom: 40px;
        max-width: 520px;
      }

      form {
        background: var(--bg-light);
        border: 1px solid rgba(196, 149, 42, 0.35);
        padding: 36px 32px;
        margin-top: 8px;
      }
      .field { margin-bottom: 22px; }
      label {
        display: block;
        font-family: 'Inter', sans-serif;
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--purple-soft);
        margin-bottom: 8px;
      }
      input, textarea, select {
        width: 100%;
        padding: 12px 14px;
        font-size: 16px;
        font-family: 'Georgia', serif;
        background: var(--bg-cream);
        color: var(--text-dark);
        border: 1px solid rgba(30, 26, 46, 0.15);
        border-radius: 0;
        transition: border-color 0.2s, background 0.2s;
      }
      input:focus, textarea:focus, select:focus {
        outline: none;
        border-color: var(--gold);
        background: var(--bg-light);
      }
      textarea { min-height: 100px; resize: vertical; }
      select {
        appearance: none;
        background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6" viewBox="0 0 10 6"><path fill="%23C4952A" d="M5 6L0 0h10z"/></svg>');
        background-repeat: no-repeat;
        background-position: right 14px center;
        padding-right: 36px;
        cursor: pointer;
      }
      .hint {
        font-family: 'Georgia', serif;
        font-style: italic;
        font-size: 13px;
        color: var(--text-muted);
        margin-top: 6px;
      }

      button {
        width: 100%;
        padding: 16px 28px;
        font-family: 'Inter', sans-serif;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        background: var(--purple);
        color: var(--gold);
        border: none;
        cursor: pointer;
        margin-top: 8px;
        transition: background 0.2s, color 0.2s;
      }
      button:hover { background: var(--gold); color: var(--purple); }
      button:disabled { opacity: 0.5; cursor: not-allowed; }

      .msg { padding: 14px 16px; margin-top: 20px; font-size: 14px; font-family: 'Georgia', serif; }
      .msg.error { background: #f5e6e6; color: #7d2b2b; border-left: 3px solid #a63030; }
      .msg.success { background: #eaf1ec; color: #2a6b52; border-left: 3px solid #2a6b52; font-size: 15px; line-height: 1.6; }
      .hidden { display: none; }
      .honeypot { position: absolute; left: -9999px; }

      .footer-links {
        margin-top: 56px;
        font-family: 'Inter', sans-serif;
        font-size: 12px;
        letter-spacing: 0.1em;
        color: var(--text-muted);
      }
      .footer-links a { color: var(--purple-soft); text-decoration: none; margin-right: 8px; }
      .footer-links a:hover { color: var(--gold); }

      @media (max-width: 640px) {
        body { padding: 48px 20px 72px; }
        h1 { font-size: 38px; }
        form { padding: 28px 22px; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="nav"><a href="/">&larr; Gebauer Watches</a></div>

      <h1>Reserve a watch.</h1>
      <p class="subtitle">One of three hundred, ever.</p>

      <p class="intro">
        Numbers aren't handed out by queue. Tell me a little about you and I'll get back personally.
      </p>

      <form id="reserve-form">
        <div class="field">
          <label for="first_name">First name</label>
          <input type="text" id="first_name" name="first_name" required maxlength="100" />
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required maxlength="200" />
        </div>

        <div class="field">
          <label for="wood_preference">Which wood?</label>
          <select id="wood_preference" name="wood_preference" required>
            <option value="">Pick one</option>
            <option value="hinoki">Hinoki &nbsp;&middot;&nbsp; $299</option>
            <option value="ebony">Black Ebony &nbsp;&middot;&nbsp; $339</option>
            <option value="padauk">African Padauk &nbsp;&middot;&nbsp; $375</option>
            <option value="unsure">Not sure yet</option>
          </select>
        </div>

        <div class="field">
          <label for="why_message">A sentence about why</label>
          <textarea id="why_message" name="why_message" maxlength="1000" placeholder="Optional. For yourself, a gift, a moment worth remembering."></textarea>
        </div>

        <div class="honeypot" aria-hidden="true">
          <label for="website">Website (leave blank)</label>
          <input type="text" id="website" name="honeypot" tabindex="-1" autocomplete="off" />
        </div>

        <button type="submit" id="submit-btn">Request a reservation</button>

        <div id="response-msg" class="msg hidden"></div>
      </form>

      <p class="footer-links">
        <a href="/about">About</a> &middot;
        <a href="/faq">FAQ</a> &middot;
        <a href="https://gebauerwatches.substack.com">Journal</a>
      </p>
    </div>

    <script>
      const form = document.getElementById('reserve-form');
      const btn = document.getElementById('submit-btn');
      const msg = document.getElementById('response-msg');

      // Pre-select wood from URL param if present (e.g., /reserve?wood=padauk)
      const urlParams = new URLSearchParams(window.location.search);
      const woodParam = urlParams.get('wood');
      const validWoods = ['hinoki', 'ebony', 'padauk', 'unsure'];
      if (woodParam && validWoods.includes(woodParam.toLowerCase())) {
        form.wood_preference.value = woodParam.toLowerCase();
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        msg.classList.add('hidden');
        btn.disabled = true;
        btn.textContent = 'Submitting...';

        const payload = {
          first_name: form.first_name.value.trim(),
          email: form.email.value.trim().toLowerCase(),
          wood_preference: form.wood_preference.value,
          why_message: form.why_message.value.trim(),
          honeypot: form.honeypot.value,
        };

        try {
          const resp = await fetch('/api/reserve', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });
          const data = await resp.json();
          if (resp.ok && data.ok) {
            msg.className = 'msg success';
            msg.textContent = "Got it. I'll be in touch personally in a few days.";
            msg.classList.remove('hidden');
            form.reset();
            btn.textContent = 'Sent';
          } else {
            msg.className = 'msg error';
            msg.textContent = data.error || 'Something went wrong. Please try again in a moment.';
            msg.classList.remove('hidden');
            btn.disabled = false;
            btn.textContent = 'Request a reservation';
          }
        } catch (err) {
          msg.className = 'msg error';
          msg.textContent = 'Network error. Please try again in a moment.';
          msg.classList.remove('hidden');
          btn.disabled = false;
          btn.textContent = 'Request a reservation';
        }
      });
    </script>
  </body>
</html>
